name: Build DictateKeyboard

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'DictateKeyboard branch to build'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Clone DictateKeyboard
        run: |
          git clone --branch ${{ github.event.inputs.branch || 'main' }} \
            https://github.com/DevEmperor/DictateKeyboard.git /tmp/dictate

      - name: Fetch sherpa-onnx native libs
        working-directory: /tmp/dictate
        run: |
          chmod +x tools/fetch-sherpa-onnx.sh
          bash tools/fetch-sherpa-onnx.sh

      - name: Build DictateKeyboard APK
        working-directory: /tmp/dictate
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-debug-${{ github.run_number }}
          path: /tmp/dictate/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30